<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เช็คอิน EAU</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Tahoma', sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    max-width: 420px;
    margin: 0 auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  h2 { margin-top: 0; font-size: 20px; }
  input, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    background: #06c755;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
  }
  button:disabled { background: #ccc; }
  .status { text-align: center; padding: 40px 0; }
  .status.success { color: #06c755; }
  .status.error { color: #e53935; }
  .icon { font-size: 48px; margin-bottom: 12px; }
  .detail { color: #666; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
  <div class="card" id="app">
    <div class="status" id="loading">
      <div class="icon">⏳</div>
      <div>กำลังโหลด...</div>
    </div>
  </div>

<script>
// ===== ตั้งค่า =====
const LIFF_ID = '2011575398-NLO46voT';
const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbzUIAYPpCnsdJz_jFQCJzAH7o3IKFdeA8C7h1LJ7d61dLULYAEgpA6WVCuCNcjxUDJk/exec';

const params = new URLSearchParams(window.location.search);
const sessionId = params.get('session');
const qrToken = params.get('token');
const mode = params.get('mode'); // 'myrecord' = ดูผลการเข้าเรียนของตัวเอง

let lineUserId = null;
const app = document.getElementById('app');

function render(html) { app.innerHTML = html; }

function showError(title, detail) {
  render(
    '<div class="status error"><div class="icon">✕</div><div>' + title + '</div>' +
    (detail ? '<div class="detail">' + detail + '</div>' : '') + '</div>'
  );
}

function showSuccess(title, detail) {
  render(
    '<div class="status success"><div class="icon">✓</div><div>' + title + '</div>' +
    (detail ? '<div class="detail">' + detail + '</div>' : '') + '</div>'
  );
}

async function apiGet(action, params) {
  const qs = new URLSearchParams(Object.assign({ action: action }, params)).toString();
  const res = await fetch(API_BASE_URL + '?' + qs);
  return res.json();
}

async function apiPost(action, data) {
  const res = await fetch(API_BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(Object.assign({ action: action }, data))
  });
  return res.json();
}

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    const profile = await liff.getProfile();
    lineUserId = profile.userId;

    if (mode === 'myrecord') {
      await showMyRecord();
      return;
    }

    if (!sessionId || !qrToken) {
      showError('ลิงก์ไม่ถูกต้อง', 'กรุณาสแกน QR ที่อาจารย์แสดงบนจอ');
      return;
    }

    const student = await apiGet('getStudent', { userId: lineUserId });

    if (!student || !student.studentId) {
      showRegisterForm(profile.displayName);
    } else {
      await proceedCheckin();
    }
  } catch (err) {
    showError('เกิดข้อผิดพลาด', err.message);
  }
}

async function showMyRecord() {
  render('<div class="status"><div class="icon">⏳</div><div>กำลังโหลดข้อมูล...</div></div>');

  const data = await apiGet('getMyRecord', { userId: lineUserId });

  if (!data.registered) {
    const profile = await liff.getProfile();
    showRegisterForm(profile.displayName, true);
    return;
  }

  const student = data.student;
  const rows = data.rows || [];
  let rowsHtml = '';

  if (rows.length === 0) {
    rowsHtml = '<div class="detail" style="text-align:center; padding:20px 0;">ยังไม่มีประวัติการเช็คอิน</div>';
  } else {
    rows.forEach(function (r) {
      rowsHtml +=
        '<div style="border-bottom:1px solid #eee; padding:10px 0;">' +
        '<div style="font-weight:600;">' + r.code + '</div>' +
        '<div class="detail">เข้าเรียน ' + r.totalCheckins + ' / ' + r.totalSessions + ' คาบ' +
        (r.fullScore ? ' • คะแนน ' + r.score + '/' + r.fullScore : '') +
        '</div></div>';
    });
  }

  render(
    '<h2>ผลการเข้าเรียนของฉัน</h2>' +
    '<div class="detail">' + student.name + ' (' + student.studentId + ')</div>' +
    '<div style="margin-top:12px;">' + rowsHtml + '</div>'
  );
}

function showRegisterForm(displayName, forRecord) {
  render(
    '<h2>ลงทะเบียนครั้งแรก</h2>' +
    '<div class="detail">สวัสดี ' + displayName + ' กรอกข้อมูลเพื่อลงทะเบียน (ครั้งเดียว ใช้ได้จนจบการศึกษา)</div>' +
    '<input id="studentId" placeholder="รหัสนักศึกษา" inputmode="numeric">' +
    '<input id="name" placeholder="ชื่อ-นามสกุล">' +
    '<input id="faculty" placeholder="คณะ">' +
    '<button id="submitBtn" onclick="submitRegister(' + (forRecord ? 'true' : 'false') + ')">ลงทะเบียน</button>'
  );
}

async function submitRegister(forRecord) {
  const studentId = document.getElementById('studentId').value.trim();
  const name = document.getElementById('name').value.trim();
  const faculty = document.getElementById('faculty').value.trim();

  if (!studentId || !name || !faculty) {
    alert('กรุณากรอกข้อมูลให้ครบ');
    return;
  }

  document.getElementById('submitBtn').disabled = true;

  const result = await apiPost('registerStudent', {
    userId: lineUserId,
    studentId: studentId,
    name: name,
    faculty: faculty
  });

  if (result.error) {
    showError('ลงทะเบียนไม่สำเร็จ', result.error);
    return;
  }

  if (forRecord) {
    await showMyRecord();
  } else {
    await proceedCheckin();
  }
}

async function proceedCheckin() {
  render('<div class="status"><div class="icon">📍</div><div>กรุณาอนุญาตการเข้าถึงตำแหน่ง</div></div>');

  navigator.geolocation.getCurrentPosition(
    async function (pos) {
      await saveCheckin(pos.coords.latitude, pos.coords.longitude);
    },
    function () {
      showError('ต้องเปิดสิทธิ์ตำแหน่ง (Location)', 'กรุณาอนุญาตแล้วลองสแกน QR ใหม่อีกครั้ง');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function saveCheckin(lat, lng) {
  render('<div class="status"><div class="icon">⏳</div><div>กำลังบันทึกเช็คอิน...</div></div>');

  const result = await apiPost('submitCheckin', {
    sessionId: sessionId,
    userId: lineUserId,
    token: qrToken,
    lat: lat,
    lng: lng
  });

  if (result.error === 'session_closed') {
    showError('คาบเรียน/กิจกรรมนี้ปิดแล้ว', 'ไม่สามารถเช็คอินได้');
  } else if (result.error === 'token_expired') {
    showError('QR หมดอายุแล้ว', 'กรุณาสแกน QR ใหม่บนจอ');
  } else if (result.error === 'not_registered') {
    showError('ยังไม่ได้ลงทะเบียน', 'กรุณาสแกน QR ใหม่อีกครั้ง');
  } else if (result.error) {
    showError('เกิดข้อผิดพลาด', result.error);
  } else if (result.alreadyCheckedIn) {
    showSuccess('เช็คอินแล้ว', 'คุณเช็คอินคาบนี้ไปแล้วเมื่อ ' + new Date(result.checkinTime).toLocaleTimeString('th-TH'));
  } else {
    showSuccess('เช็คอินสำเร็จ', result.studentName + ' • ' + new Date(result.time).toLocaleTimeString('th-TH'));
  }
}

main();
</script>
</body>
</html>
